<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
	<!-- JPKCom Desktop — example image: a sketch of the desktop — © Jean Pierre Kolb — MIT License -->
	<title id="title">Desk sketch</title>
	<desc id="desc">A screen with a menu bar, two windows side by side, a small note and a dock with five tiles.</desc>
	<defs>
		<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#3c4955"/>
			<stop offset="1" stop-color="#0c1925"/>
		</linearGradient>
		<linearGradient id="t1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#56adff"/><stop offset="1" stop-color="#1c62d6"/></linearGradient>
		<linearGradient id="t2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb547"/><stop offset="1" stop-color="#ef6420"/></linearGradient>
		<linearGradient id="t3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#45d8c4"/><stop offset="1" stop-color="#0e8783"/></linearGradient>
		<linearGradient id="t4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a476ff"/><stop offset="1" stop-color="#5a2dd4"/></linearGradient>
		<linearGradient id="t5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#52d879"/><stop offset="1" stop-color="#1b9245"/></linearGradient>
	</defs>

	<!-- screen -->
	<rect width="720" height="480" rx="18" fill="url(#wall)"/>
	<circle cx="360" cy="-60" r="360" fill="#ffffff" opacity="0.06"/>

	<!-- menu bar -->
	<rect width="720" height="28" rx="0" fill="#0b141c" opacity="0.72"/>
	<circle cx="22" cy="14" r="6" fill="#e6ebf0"/>
	<rect x="40" y="10" width="54" height="8" rx="4" fill="#e6ebf0" opacity="0.85"/>
	<rect x="108" y="10" width="38" height="8" rx="4" fill="#e6ebf0" opacity="0.55"/>
	<rect x="160" y="10" width="44" height="8" rx="4" fill="#e6ebf0" opacity="0.55"/>
	<rect x="618" y="10" width="82" height="8" rx="4" fill="#e6ebf0" opacity="0.55"/>

	<!-- left window: a page -->
	<g>
		<rect x="40" y="56" width="318" height="300" rx="12" fill="#1c2733"/>
		<rect x="40" y="56" width="318" height="34" rx="12" fill="#26323e"/>
		<rect x="40" y="78" width="318" height="12" fill="#26323e"/>
		<circle cx="60" cy="73" r="6" fill="#ff5f57"/>
		<circle cx="80" cy="73" r="6" fill="#febc2e"/>
		<circle cx="100" cy="73" r="6" fill="#28c840"/>
		<rect x="150" y="68" width="98" height="10" rx="5" fill="#e6ebf0" opacity="0.6"/>
		<rect x="66" y="112" width="190" height="18" rx="5" fill="#e6ebf0" opacity="0.9"/>
		<rect x="66" y="142" width="250" height="9" rx="4.5" fill="#a3b0bc" opacity="0.8"/>
		<rect x="66" y="160" width="224" height="9" rx="4.5" fill="#a3b0bc" opacity="0.8"/>
		<rect x="66" y="190" width="266" height="7" rx="3.5" fill="#a3b0bc" opacity="0.5"/>
		<rect x="66" y="205" width="252" height="7" rx="3.5" fill="#a3b0bc" opacity="0.5"/>
		<rect x="66" y="220" width="262" height="7" rx="3.5" fill="#a3b0bc" opacity="0.5"/>
		<rect x="66" y="235" width="180" height="7" rx="3.5" fill="#a3b0bc" opacity="0.5"/>
		<rect x="66" y="262" width="266" height="70" rx="8" fill="#0b141c" opacity="0.7"/>
		<rect x="80" y="278" width="120" height="7" rx="3.5" fill="#45d8c4" opacity="0.8"/>
		<rect x="80" y="294" width="170" height="7" rx="3.5" fill="#8fc0ff" opacity="0.7"/>
		<rect x="80" y="310" width="96" height="7" rx="3.5" fill="#ffb547" opacity="0.7"/>
	</g>

	<!-- right window: an icon grid -->
	<g>
		<rect x="370" y="56" width="310" height="300" rx="12" fill="#1c2733"/>
		<rect x="370" y="56" width="310" height="34" rx="12" fill="#26323e"/>
		<rect x="370" y="78" width="310" height="12" fill="#26323e"/>
		<circle cx="390" cy="73" r="6" fill="#ff5f57"/>
		<circle cx="410" cy="73" r="6" fill="#febc2e"/>
		<circle cx="430" cy="73" r="6" fill="#28c840"/>
		<rect x="478" y="68" width="92" height="10" rx="5" fill="#e6ebf0" opacity="0.6"/>
		<rect x="370" y="90" width="84" height="266" fill="#ffffff" opacity="0.04"/>
		<rect x="384" y="108" width="56" height="8" rx="4" fill="#e6ebf0" opacity="0.7"/>
		<rect x="384" y="128" width="44" height="8" rx="4" fill="#a3b0bc" opacity="0.5"/>
		<rect x="384" y="148" width="50" height="8" rx="4" fill="#a3b0bc" opacity="0.5"/>
		<g>
			<rect x="474" y="110" width="48" height="48" rx="11" fill="url(#t1)"/>
			<rect x="540" y="110" width="48" height="48" rx="11" fill="url(#t2)"/>
			<rect x="606" y="110" width="48" height="48" rx="11" fill="url(#t3)"/>
			<rect x="474" y="190" width="48" height="48" rx="11" fill="url(#t4)"/>
			<rect x="540" y="190" width="48" height="48" rx="11" fill="url(#t5)"/>
			<rect x="606" y="190" width="48" height="48" rx="11" fill="url(#t1)"/>
			<rect x="474" y="270" width="48" height="48" rx="11" fill="url(#t3)"/>
			<rect x="540" y="270" width="48" height="48" rx="11" fill="url(#t2)"/>
		</g>
		<rect x="480" y="164" width="36" height="6" rx="3" fill="#e6ebf0" opacity="0.6"/>
		<rect x="546" y="164" width="36" height="6" rx="3" fill="#e6ebf0" opacity="0.6"/>
		<rect x="612" y="164" width="36" height="6" rx="3" fill="#e6ebf0" opacity="0.6"/>
		<rect x="480" y="244" width="36" height="6" rx="3" fill="#e6ebf0" opacity="0.6"/>
		<rect x="546" y="244" width="36" height="6" rx="3" fill="#e6ebf0" opacity="0.6"/>
		<rect x="612" y="244" width="36" height="6" rx="3" fill="#e6ebf0" opacity="0.6"/>
	</g>

	<!-- a note on top -->
	<g transform="rotate(-4 300 330)">
		<rect x="250" y="292" width="120" height="96" rx="6" fill="#ffd66b"/>
		<rect x="264" y="310" width="78" height="7" rx="3.5" fill="#6b4e00" opacity="0.6"/>
		<rect x="264" y="326" width="92" height="7" rx="3.5" fill="#6b4e00" opacity="0.45"/>
		<rect x="264" y="342" width="64" height="7" rx="3.5" fill="#6b4e00" opacity="0.45"/>
	</g>

	<!-- dock -->
	<rect x="214" y="400" width="292" height="64" rx="18" fill="#ffffff" opacity="0.16"/>
	<rect x="228" y="410" width="44" height="44" rx="10" fill="url(#t1)"/>
	<rect x="284" y="410" width="44" height="44" rx="10" fill="url(#t2)"/>
	<rect x="340" y="410" width="44" height="44" rx="10" fill="url(#t3)"/>
	<rect x="396" y="410" width="44" height="44" rx="10" fill="url(#t4)"/>
	<rect x="452" y="410" width="44" height="44" rx="10" fill="url(#t5)"/>
	<circle cx="250" cy="459" r="2" fill="#e6ebf0"/>
	<circle cx="362" cy="459" r="2" fill="#e6ebf0"/>
</svg>
