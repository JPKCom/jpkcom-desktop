# JPKCom Desktop — continuous integration: tests and checks — © Jean Pierre Kolb — MIT License
#
# Runs the same checks as CONTRIBUTING.md asks for before a pull request. No secrets, read-only token.
# Supply chain: actions pinned to a commit SHA (the tag in the comment), npm ci from the lockfile with
# install scripts off (.npmrc ignore-scripts), registry signatures and attestations verified.
# The headless browser check (tools/browser-check.mjs) is not part of CI; run it locally.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tests and checks (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install development tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify package signatures
        run: npm audit signatures

      - name: Unit tests
        run: npm test

      - name: Translations
        run: npm run i18n:check

      - name: Icon subset up to date
        run: npm run icons:check

      - name: Site manifest
        run: node tools/validate-manifest.mjs
