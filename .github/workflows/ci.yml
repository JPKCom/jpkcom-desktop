# JPKCom Desktop — continuous integration: tests and checks — © Jean Pierre Kolb — MIT License
#
# Runs the same checks as CONTRIBUTING.md asks for before a pull request. No secrets, read-only token.
# The headless browser check (tools/browser-check.mjs) is not part of CI; run it locally.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tests and checks (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install development tools
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Translations
        run: npm run i18n:check

      - name: Icon subset up to date
        run: npm run icons:check

      - name: Site manifest
        run: node tools/validate-manifest.mjs
